[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptrclassify"
version = "0.2.0"
description = "Explainable heuristic classifier for reverse-DNS PTR hostnames"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-2-Clause"}
authors = [{name = "CIRCL-oriented prototype"}]
keywords = ["dns", "rdns", "ptr", "ip", "classification", "network"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Topic :: Internet :: Name Service (DNS)",
]

[project.optional-dependencies]
hyperscan = ["hyperscan>=0.7.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ptrclassify = "ptrclassify.cli:main"
ptrclassify-api = "ptrclassify.api:main"

[tool.setuptools.package-data]
ptrclassify = ["data/*.json"]
